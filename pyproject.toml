[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-ranking-system"
version = "0.1.0"
description = "Local-first, bias-audited candidate ranking pipeline (free open-source stack)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies mirror requirements.txt (the pinned manifest is the
# single source of truth for exact install; see requirements.txt).
dependencies = [
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
]

[tool.setuptools]
packages = ["pipeline", "audit", "personas", "models", "output", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
